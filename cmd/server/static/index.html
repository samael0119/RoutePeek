<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetScope - 网络拓扑可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
        }
        
        h1 {
            font-size: 2.5em;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        
        .subtitle {
            color: #888;
            margin-top: 10px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .card-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .interface-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .interface-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #00d9ff;
        }
        
        .interface-item.wifi { border-left-color: #00ff88; }
        .interface-item.vpn { border-left-color: #ff6b6b; }
        .interface-item.virtual { border-left-color: #ffd93d; }
        .interface-item.docker { border-left-color: #6bcbff; }
        
        .interface-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .interface-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .interface-type {
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .interface-details {
            font-size: 0.9em;
            color: #aaa;
        }
        
        .interface-details div {
            margin: 4px 0;
        }
        
        .route-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .route-table th,
        .route-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .route-table th {
            color: #00d9ff;
            font-weight: 600;
        }
        
        .route-table tr:hover {
            background: rgba(0, 217, 255, 0.05);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        
        .status-connected { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .status-disconnected { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .status-warning { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
        
        .finding {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid;
        }
        
        .finding.critical { border-left-color: #ff4757; }
        .finding.warning { border-left-color: #ffa502; }
        .finding.info { border-left-color: #00d9ff; }
        
        .finding-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .finding-title {
            font-weight: bold;
        }
        
        .finding-code {
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .finding-message {
            color: #bbb;
            margin: 8px 0;
            line-height: 1.6;
        }
        
        .finding-suggestion {
            background: rgba(0, 217, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 0.9em;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .topology-diagram {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            overflow-x: auto;
        }
        
        .topology-flow {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .topology-node {
            background: rgba(0, 217, 255, 0.15);
            border: 2px solid #00d9ff;
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
            min-width: 100px;
        }
        
        .topology-node.gateway { border-color: #ffa502; background: rgba(255, 165, 2, 0.15); }
        .topology-node.vpn { border-color: #ff6b6b; background: rgba(255, 107, 107, 0.15); }
        .topology-node.vm { border-color: #ffd93d; background: rgba(255, 217, 61, 0.15); }
        .topology-node.dns { border-color: #00ff88; background: rgba(0, 255, 136, 0.15); }
        .topology-node.public { border-color: #9b59b6; background: rgba(155, 89, 182, 0.15); }
        
        .topology-arrow {
            color: #555;
            font-size: 1.5em;
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-item {
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
        }
        
        .section { display: none; }
        .section.active { display: block; }
        
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .topology-flow { flex-direction: column; }
            .topology-arrow { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 NetScope</h1>
            <p class="subtitle">网络拓扑可视化 + 诊断工具</p>
        </header>
        
        <nav class="nav">
            <div class="nav-item active" onclick="showSection('overview')">📊 总览</div>
            <div class="nav-item" onclick="showSection('interfaces')">📡 接口</div>
            <div class="nav-item" onclick="showSection('routes')">📋 路由</div>
            <div class="nav-item" onclick="showSection('diagnosis')">🔧 诊断</div>
        </nav>
        
        <button class="refresh-btn" onclick="refreshData()" style="margin-bottom: 20px;">
            🔄 刷新数据
        </button>
        
        <div id="loading" class="loading" style="display: none;">
            <p>正在加载数据...</p>
        </div>
        
        <!-- Overview Section -->
        <div id="overview" class="section active">
            <div class="topology-diagram">
                <h3 style="margin-bottom: 15px;">📍 网络路径拓扑</h3>
                <div id="topology" class="topology-flow">
                    <!-- Populated by JS -->
                </div>
            </div>
            
            <div class="grid">
                <div class="card">
                    <h3 class="card-title">📡 网络接口</h3>
                    <div id="overview-interfaces" class="interface-list">
                        <p class="loading">加载中...</p>
                    </div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">🔤 DNS 配置</h3>
                    <div id="overview-dns">
                        <p class="loading">加载中...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Interfaces Section -->
        <div id="interfaces" class="section">
            <div class="card">
                <h3 class="card-title">📡 所有网络接口</h3>
                <div id="interfaces-list" class="interface-list">
                    <p class="loading">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- Routes Section -->
        <div id="routes" class="section">
            <div class="card">
                <h3 class="card-title">📋 路由表</h3>
                <div id="routes-table">
                    <p class="loading">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- Diagnosis Section -->
        <div id="diagnosis" class="section">
            <div class="card">
                <h3 class="card-title">🔧 网络诊断报告</h3>
                <div id="diagnosis-report">
                    <p class="loading">加载中...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let snapshotData = null;
        
        function showSection(name) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
        }
        
        function refreshData() {
            document.getElementById('loading').style.display = 'block';
            
            Promise.all([
                fetch('/api/snapshot').then(r => r.json()),
                fetch('/api/diagnosis').then(r => r.json())
            ]).then(([snapshot, diagnosis]) => {
                snapshotData = snapshot;
                renderOverview(snapshot);
                renderInterfaces(snapshot.interfaces);
                renderRoutes(snapshot.routes);
                renderDiagnosis(diagnosis);
                document.getElementById('loading').style.display = 'none';
            }).catch(err => {
                console.error('Failed to load data:', err);
                document.getElementById('loading').innerHTML = '<p style="color: #ff6b6b;">加载失败，请刷新重试</p>';
            });
        }
        
        function renderOverview(snapshot) {
            // Topology
            renderTopology(snapshot);
            
            // Interfaces (first 4)
            const ifaceContainer = document.getElementById('overview-interfaces');
            if (snapshot.interfaces && snapshot.interfaces.length > 0) {
                ifaceContainer.innerHTML = snapshot.interfaces.slice(0, 4).map(iface => 
                    renderInterfaceItem(iface)
                ).join('');
            } else {
                ifaceContainer.innerHTML = '<p>未检测到网络接口</p>';
            }
            
            // DNS
            const dnsContainer = document.getElementById('overview-dns');
            if (snapshot.dns && snapshot.dns.servers && snapshot.dns.servers.length > 0) {
                dnsContainer.innerHTML = snapshot.dns.servers.map((dns, i) => 
                    `<div style="margin: 8px 0; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                        <strong>${i + 1}.</strong> ${dns}
                    </div>`
                ).join('');
            } else {
                dnsContainer.innerHTML = '<p>未检测到 DNS 配置</p>';
            }
        }
        
        function renderTopology(snapshot) {
            const container = document.getElementById('topology');
            const nodes = ['<div class="topology-node">本机</div>'];
            
            // Add default gateway
            if (snapshot.default_gateway) {
                nodes.push('<span class="topology-arrow">→</span>');
                nodes.push(`<div class="topology-node gateway">网关<br>${snapshot.default_gateway}</div>`);
            }
            
            // Add VPN if connected
            if (snapshot.vpn && snapshot.vpn.status === 'connected') {
                nodes.push('<span class="topology-arrow">→</span>');
                nodes.push(`<div class="topology-node vpn">VPN<br>${snapshot.vpn.interface || '已连接'}</div>`);
            }
            
            // Add DNS
            if (snapshot.dns && snapshot.dns.servers && snapshot.dns.servers.length > 0) {
                nodes.push('<span class="topology-arrow">→</span>');
                nodes.push(`<div class="topology-node dns">DNS<br>${snapshot.dns.servers[0]}</div>`);
            }
            
            // Add public IP
            if (snapshot.public_ip) {
                nodes.push('<span class="topology-arrow">→</span>');
                nodes.push(`<div class="topology-node public">公网<br>${snapshot.public_ip}</div>`);
            }
            
            container.innerHTML = nodes.join('');
        }
        
        function renderInterfaces(interfaces) {
            const container = document.getElementById('interfaces-list');
            if (!interfaces || interfaces.length === 0) {
                container.innerHTML = '<p>未检测到网络接口</p>';
                return;
            }
            container.innerHTML = interfaces.map(iface => renderInterfaceItem(iface)).join('');
        }
        
        function renderInterfaceItem(iface) {
            const statusIcon = iface.is_up ? '✅' : '❌';
            return `
                <div class="interface-item ${iface.type || ''}">
                    <div class="interface-header">
                        <span class="interface-name">${iface.name}</span>
                        <span class="interface-type">${iface.type || 'unknown'}</span>
                    </div>
                    <div class="interface-details">
                        <div>📶 ${statusIcon} ${iface.is_up ? '已启用' : '已禁用'}</div>
                        ${iface.ip4 ? `<div>🌐 IP: ${iface.ip4}</div>` : ''}
                        ${iface.mac ? `<div>📍 MAC: ${iface.mac}</div>` : ''}
                        ${iface.mtu ? `<div>⚙️ MTU: ${iface.mtu}</div>` : ''}
                    </div>
                </div>
            `;
        }
        
        function renderRoutes(routes) {
            const container = document.getElementById('routes-table');
            if (!routes || routes.length === 0) {
                container.innerHTML = '<p>未检测到路由表</p>';
                return;
            }
            
            let html = `
                <table class="route-table">
                    <thead>
                        <tr>
                            <th>目标网络</th>
                            <th>网关</th>
                            <th>接口</th>
                            <th>Metric</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            routes.forEach(route => {
                html += `
                    <tr>
                        <td>${route.destination}</td>
                        <td>${route.gateway || '*'}</td>
                        <td>${route.interface}</td>
                        <td>${route.metric}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function renderDiagnosis(report) {
            const container = document.getElementById('diagnosis-report');
            
            if (!report.findings || report.findings.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #00ff88;">
                        <p style="font-size: 3em;">✅</p>
                        <p>网络配置正常，未发现问题</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <p style="margin-bottom: 20px; color: #ffd93d;">📊 ${report.summary || '发现 ' + report.findings.length + ' 个问题'}</p>
                ${report.findings.map(f => `
                    <div class="finding ${f.severity}">
                        <div class="finding-header">
                            <span class="finding-title">${f.title}</span>
                            <span class="finding-code">${f.code}</span>
                        </div>
                        <p class="finding-message">${f.message.replace(/\n/g, '<br>')}</p>
                        <div class="finding-suggestion">
                            💡 ${f.suggestion.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `).join('')}
            `;
        }
        
        // Initial load
        refreshData();
        
        // Auto refresh every 10 seconds
        setInterval(refreshData, 10000);
    </script>
</body>
</html>
